name: Publish candidate family

on:
  push:
    branches:
      - main
    paths:
      - "fr27_section_launcher.py"
      - "assets/fr27-section-launcher.css"
      - "assets/fr27-section-launcher.js"
      - "candidate_signals.json"
      - "candidate_visibility_history.json"
      - "candidate_agenda_history.json"
      - "candidate_attention.json"
      - "candidate_candidacy_status.json"
      - "claims_under_scrutiny.json"
      - "recent_changes.json"
      - "campaign_events.json"
      - "polls.json"
      - "poll_explorer.json"
      - "second_round_polls.json"
      - "news_wire.json"
      - "publication_manifest.json"
      - "build_candidate_reference.py"
      - "candidate_candidacy_status.py"
      - "candidate_page_contract.py"
      - "candidate_hub.py"
      - "build_route_registry.py"
      - "build_search_entrypoints.py"
      - "build_sitemaps.py"
      - "assets/candidate-page-shell.css"
      - "assets/candidate-page.css"
      - "assets/candidate-page.js"
      - "assets/candidate-hub.css"
      - "assets/candidate-hub.js"
      - "assets/candidate-family-hud.js"
      - "assets/candidate-hub-directory.js"
      - ".github/workflows/publish-candidate-family.yml"

  # Automated production writers normally push with GITHUB_TOKEN.
  # Those pushes do not create another push-triggered workflow run,
  # so follow the writers through workflow_run as well.
  workflow_run:
    workflows:
      - "Update polls"
      - "Update Election News Wire"
      - "Update Claims Under Scrutiny"
      - "Update candidate attention"
      - "Validate campaign events"
    types:
      - completed
    branches:
      - main

  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: production-data-update
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas lxml pypdf

      - name: Check candidate publication dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import json
          import os
          from datetime import date, datetime, timezone
          from pathlib import Path

          from candidate_attention_contract import (
              CandidateAttentionContractError,
              validate_candidate_attention,
          )
          from candidate_candidacy_status import (
              active_candidate_records,
              active_projection_provenance,
              load_candidate_candidacy_status,
          )
          from fetch_claims_under_scrutiny import (
              CollectorError,
              validate_public_bundle,
          )
          from fetch_news_wire import candidate_roster_metadata, validate_output

          candidacy = load_candidate_candidacy_status(
              "candidate_candidacy_status.json"
          )
          active_candidates = active_candidate_records(
              candidacy
          )

          claims = json.loads(
              Path("claims_under_scrutiny.json").read_text(
                  encoding="utf-8"
              )
          )
          attention = json.loads(
              Path("candidate_attention.json").read_text(
                  encoding="utf-8"
              )
          )
          news = json.loads(
              Path("news_wire.json").read_text(
                  encoding="utf-8"
              )
          )

          ready = True
          reasons = []

          # Claims: malformed content is a hard failure. Only a
          # legitimate registry-projection lag is a clean defer.
          validate_public_bundle(
              claims,
              expected_archive_window_days=365,
          )
          if not isinstance(claims.get("candidate_query"), dict):
              raise SystemExit("claims_under_scrutiny.json lacks candidate query provenance")
          try:
              validate_public_bundle(
                  claims,
                  expected_archive_window_days=365,
                  candidacy_payload=candidacy,
              )
          except CollectorError as error:
              if str(error) != (
                  "candidate query does not match active registry projection"
              ):
                  raise

              ready = False
              claims_revision = claims["candidate_query"].get(
                  "source_revision_id",
                  "unknown",
              )
              registry_revision = candidacy["source"]["revision_id"]
              reasons.append(
                  "Claims Under Scrutiny references Candidate Registry "
                  f"revision {claims_revision}; current registry revision "
                  f"is {registry_revision}."
              )

          # Attention: validate the artifact independently first so
          # corruption remains a hard failure; only current-universe
          # parity is allowed to defer candidate publication.
          validate_candidate_attention(attention)

          try:
              validate_candidate_attention(
                  attention,
                  expected_candidates=active_candidates,
              )
          except CandidateAttentionContractError as error:
              ready = False
              reasons.append(
                  "Candidate Attention does not match the current active "
                  f"candidate universe: {error}"
              )

          attention_universe = attention["candidate_universe"]
          if any(
              attention_universe.get(key) != value
              for key, value in active_projection_provenance(candidacy).items()
          ):
              ready = False
              reasons.append(
                  "Candidate Attention provenance does not match the current "
                  "Candidate Registry projection."
              )

          # News: schema/content corruption is a hard failure.
          # Candidate-roster lag is a clean defer.
          validate_output(news)

          candidate_roster = news.get("candidate_roster")

          if not isinstance(candidate_roster, dict):
              raise SystemExit(
                  "news_wire.json candidate_roster must be an object"
              )

          # validate_output does not validate roster metadata. Validate it
          # independently before treating an otherwise valid old roster as lag.
          if set(candidate_roster) != set(candidate_roster_metadata(candidacy)):
              raise SystemExit("news_wire.json candidate_roster fields are invalid")
          if (
              candidate_roster["source"] != "candidate_candidacy_status.json"
              or candidate_roster["rule"] != "active_monitoring_field"
          ):
              raise SystemExit("news_wire.json candidate_roster authority is invalid")
          names = candidate_roster["names"]
          if (
              not isinstance(names, list)
              or any(not isinstance(name, str) or not name.strip() for name in names)
              or len(set(names)) != len(names)
              or type(candidate_roster["count"]) is not int
              or candidate_roster["count"] != len(names)
              or type(candidate_roster["source_revision_id"]) is not int
              or candidate_roster["source_revision_id"] <= 0
          ):
              raise SystemExit("news_wire.json candidate_roster identities are invalid")
          date.fromisoformat(candidate_roster["status_as_of"])
          timestamp = datetime.fromisoformat(
              candidate_roster["source_revision_timestamp"].replace("Z", "+00:00")
          )
          if timestamp.tzinfo is None or timestamp.utcoffset() != timezone.utc.utcoffset(None):
              raise SystemExit("news_wire.json candidate_roster timestamp must use UTC")
          registry_revision = candidacy["source"]["revision_id"]

          news_aligned = candidate_roster == candidate_roster_metadata(candidacy)

          if not news_aligned:
              ready = False
              reasons.append(
                  "Election News Wire candidate_roster is not aligned "
                  f"with Candidate Registry revision {registry_revision}."
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"ready={str(ready).lower()}\n"
              )

          if ready:
              print(
                  "Candidate publication dependencies are aligned: "
                  "Claims, Candidate Attention and Election News Wire."
              )
          else:
              reason = "\n".join(
                  f"- {item}"
                  for item in reasons
              )
              print(
                  "Candidate publication deferred:\n"
                  + reason
              )

              summary_path = os.environ.get(
                  "GITHUB_STEP_SUMMARY"
              )

              if summary_path:
                  with Path(summary_path).open(
                      "a",
                      encoding="utf-8",
                  ) as summary:
                      summary.write(
                          "## Candidate publication deferred\n\n"
                          + reason
                          + "\n"
                      )
          PY

      - name: Build and validate candidate publication
        id: build
        if: steps.dependencies.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          effective_date="$(date -u +'%Y-%m-%d')"
          echo "effective_date=$effective_date" >> "$GITHUB_OUTPUT"

          python -B build_candidate_reference.py --all-active
          python -B build_candidate_reference.py --all-active --check

          python -B build_route_registry.py \
            --effective-date "$effective_date"
          python -B build_route_registry.py --check

          python -B build_search_entrypoints.py
          python -B build_search_entrypoints.py --check

          # Search changes the home-page content hashed by the registry.
          # Finalize those hashes after consuming the rebuilt route census.
          python -B build_route_registry.py \
            --effective-date "$effective_date"
          python -B build_route_registry.py --check
          python -B build_search_entrypoints.py --check

          python -B build_sitemaps.py
          python -B build_sitemaps.py --check

          python -B -m unittest -v \
            test_candidate_page_contract \
            test_candidate_reference \
            test_candidate_poll_links \
            test_candidate_hub \
            test_candidate_family_publication \
            test_route_registry \
            test_search_foundation

          git diff --check

      - name: Commit generated candidate publication
        id: commit
        if: steps.dependencies.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- \
            candidates en/candidates \
            route_registry.json sitemap.xml sitemap-candidates.xml \
            sitemap-core.xml sitemap-polls.xml \
            index.html en/index.html)" ]]; then
            echo "Candidate publication is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            candidates en/candidates \
            route_registry.json sitemap.xml sitemap-candidates.xml \
            sitemap-core.xml sitemap-polls.xml \
            index.html en/index.html
          git commit -m "Refresh candidate family"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase, reconcile and push
        if: steps.commit.outputs.changed == 'true'
        env:
          ROUTE_EFFECTIVE_DATE: ${{ steps.build.outputs.effective_date }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          python -B build_candidate_reference.py --all-active
          python -B build_candidate_reference.py --all-active --check

          python -B build_route_registry.py \
            --effective-date "$ROUTE_EFFECTIVE_DATE"
          python -B build_route_registry.py --check

          python -B build_search_entrypoints.py
          python -B build_search_entrypoints.py --check

          # Reconcile home-page hashes without changing search destinations.
          python -B build_route_registry.py \
            --effective-date "$ROUTE_EFFECTIVE_DATE"
          python -B build_route_registry.py --check
          python -B build_search_entrypoints.py --check

          python -B build_sitemaps.py
          python -B build_sitemaps.py --check

          python -B -m unittest -v \
            test_candidate_page_contract \
            test_candidate_reference \
            test_candidate_poll_links \
            test_candidate_hub \
            test_candidate_family_publication \
            test_route_registry \
            test_search_foundation

          git diff --check

          git add -- \
            candidates en/candidates \
            route_registry.json sitemap.xml sitemap-candidates.xml \
            sitemap-core.xml sitemap-polls.xml \
            index.html en/index.html

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if [[ -n "$(git status --porcelain -- \
            candidates en/candidates \
            route_registry.json sitemap.xml sitemap-candidates.xml \
            sitemap-core.xml sitemap-polls.xml \
            index.html en/index.html)" ]]; then
            echo "Candidate publication artifacts are not clean before push."
            git status --short -- \
              candidates en/candidates \
              route_registry.json sitemap.xml sitemap-candidates.xml \
              sitemap-core.xml sitemap-polls.xml \
              index.html en/index.html
            exit 1
          fi

          git push origin HEAD:main

      # A commit pushed by a workflow using GITHUB_TOKEN does not
      # automatically trigger a GitHub Pages build. Request one only
      # after the generated candidate publication has landed.
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/builds"
