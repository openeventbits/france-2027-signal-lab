name: Validate dashboard PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas lxml pypdf

      - name: Verify Node.js
        run: node --version

      - name: Validate reviewed election scope and bilingual polling behavior
        run: |
          python -B poll_scope.py --check
          python -B -m unittest -v test_poll_scope
          node test_poll_scope.js
          node test_poll_source_projection.js

      - name: Run dashboard integration smoke tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest -v \
            test_commission_10342_registry_review \
            test_fr27_section_launcher \
            test_publication_manifest \
            test_candidate_polymarket \
            test_candidate_youtube \
            test_candidate_bluesky \
            test_candidate_polymarket_history \
            test_candidate_youtube_history \
            test_candidate_bluesky_history \
            test_candidate_public_signals \
            test_candidate_refresh_cycle \
            test_candidate_family_publication \
            test_frontend_facts \
            test_news_corpus_ledger \
            test_hud_corpus_counts \
            test_candidate_signals_frontend \
            test_final_dashboard_shell \
            test_agenda_frontend_hardening \
            test_workflow_media_pulse_contract \
            test_recent_changes \
            test_news_change_integrity \
            test_campaign_event_grouping \
            test_social_publish \
            test_search_foundation \
            test_candidate_signals_workflow_contract \
            test_candidate_universe_workflow_contract \
            test_claims_workflow_contract \
            test_news_workflow_contract \
            test_agenda_family_automation \
            test_production_publication_queue \
            test_dashboard_publication_automation
