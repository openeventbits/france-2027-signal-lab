name: Validate recovery modules

'on':
  pull_request:

permissions:
  contents: read

jobs:
  recovery-module-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out PR merge result
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select changed recovery modules
        id: modules
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          # The PR checkout's first parent is the target branch. Comparing its
          # merge result selects PR changes without importing other PR fixes.
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^1', 'HEAD'], text=True,
          ).splitlines())
          paths = {
              'candidate': {'build_candidate_reference.py', 'test_candidate_reference.py'},
              'polls': {'test_reviewed_cluster17_source_retention.py'},
              'news': {'test_live_projections.py'},
          }
          selected = {name: bool(changed & names) for name, names in paths.items()}
          selected['any'] = any(selected.values())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, enabled in selected.items():
                  output.write(f'{name}={str(enabled).lower()}\n')
          print('Selected modules:', ', '.join(name for name in paths if selected[name]) or 'none')
          PY

      - name: Set up Python
        if: steps.modules.outputs.any == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        if: steps.modules.outputs.any == 'true'
        run: |
          python -m pip install --disable-pip-version-check pandas lxml pypdf
          node --version

      - name: Candidate localization and bounded translation controls
        if: steps.modules.outputs.candidate == 'true'
        run: python -B -m unittest -v test_candidate_reference.CandidateBilingualReferenceTests

      - name: Polls historical retention and extraction-loss controls
        if: steps.modules.outputs.polls == 'true'
        run: python -B -m unittest -v test_reviewed_cluster17_source_retention

      - name: News projection and UTC-boundary controls
        if: steps.modules.outputs.news == 'true'
        run: python -B -m unittest -v test_live_projections
