name: Update polls

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: production-data-update
  cancel-in-progress: false

jobs:
  update-polls:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml pypdf

      - name: Test first-round polling contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -B -m unittest -v
          test_commission_notice_discovery.py
          test_commission_notice_coverage.py
          test_fetch_polls.py
          test_poll_migration.py
          test_frontend_facts.py
          test_publication_manifest.PublicationManifestTests.test_poll_coverage_warns_only_for_unresolved_relevant_notices

      - name: Fetch polls into temporary files
        run: |
          python fetch_polls.py \
            --wikipedia-source french \
            --previous-first-round polls.json \
            --previous-second-round second_round_polls.json \
            --poll-wave-overrides poll_wave_overrides.json \
            --output /tmp/polls.json \
            --second-round-output /tmp/second_round_polls.json \
            --closest-runoff-output /tmp/closest_tested_runoff.json \
            --commission-registry commission_notice_registry.json \
            --commission-registry-output /tmp/commission_notice_registry.json

      - name: Validate and stage fetched data
        id: validate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          from commission_notice_discovery import validate_registry
          from fetch_polls import (
              filter_rejected_poll_waves,
              load_poll_wave_overrides,
          )
          from poll_contract import FIRST_ROUND, PollContractError, validate_poll_events
          from poll_migration import load_migration_registry

          current_path = Path("polls.json")
          fetched_path = Path("/tmp/polls.json")
          second_round_path = Path("second_round_polls.json")
          fetched_second_round_path = Path("/tmp/second_round_polls.json")
          closest_path = Path("closest_tested_runoff.json")
          fetched_closest_path = Path("/tmp/closest_tested_runoff.json")
          registry_path = Path("commission_notice_registry.json")
          fetched_registry_path = Path("/tmp/commission_notice_registry.json")
          overrides_path = Path("poll_wave_overrides.json")

          current = json.loads(current_path.read_text(encoding="utf-8"))
          current_second_round = json.loads(
              second_round_path.read_text(encoding="utf-8")
          )
          current_closest = json.loads(
              closest_path.read_text(encoding="utf-8")
          )
          fetched = json.loads(fetched_path.read_text(encoding="utf-8"))
          second_round = json.loads(
              fetched_second_round_path.read_text(encoding="utf-8")
          )
          closest = json.loads(
              fetched_closest_path.read_text(encoding="utf-8")
          )
          current_registry = json.loads(
              registry_path.read_text(encoding="utf-8")
          )
          fetched_registry = json.loads(
              fetched_registry_path.read_text(encoding="utf-8")
          )
          overrides = load_poll_wave_overrides(overrides_path)

          validate_registry(current_registry)
          validate_registry(fetched_registry)

          if not isinstance(current, list) or not isinstance(fetched, list):
              raise SystemExit("polls data must be a JSON list")

          if not fetched:
              raise SystemExit("refusing to replace polls.json with an empty dataset")

          try:
              contract_counts = validate_poll_events(fetched)
          except PollContractError as error:
              raise SystemExit(f"invalid first-round poll contract: {error}")

          reviewed_current, rejected_current_events, rejected_current_waves = (
              filter_rejected_poll_waves(current, overrides)
          )
          publishable_fetched, rejected_fetched_events, _ = (
              filter_rejected_poll_waves(fetched, overrides)
          )
          if rejected_fetched_events or publishable_fetched != fetched:
              raise SystemExit(
                  "fetched polls still contain an explicitly rejected wave"
              )

          if len(fetched) < len(reviewed_current):
              raise SystemExit(
                  "refusing unreviewed dataset shrink: "
                  f"{len(reviewed_current)} expected publishable -> "
                  f"{len(fetched)} events"
              )

          required = {
              "event_id",
              "pollster",
              "fieldwork_start",
              "fieldwork_end",
              "round",
              "scenario_key",
              "source_url",
              "candidates",
          }

          event_ids = set()
          source_urls = set()

          for index, event in enumerate(fetched):
              missing = required - event.keys()

              if missing:
                  raise SystemExit(
                      f"event {index} missing fields: {sorted(missing)}"
                  )

              if event["event_id"] in event_ids:
                  raise SystemExit(
                      f"duplicate event_id: {event['event_id']}"
                  )

              event_ids.add(event["event_id"])
              source_urls.add(event["source_url"])

              if event["round"] != "first_round":
                  raise SystemExit(f"unexpected round in event {index}")

              if (
                  not isinstance(event["candidates"], list)
                  or len(event["candidates"]) < 2
              ):
                  raise SystemExit(
                      f"event {index} has fewer than two candidates"
                  )

          required_notices = {
              "https://www.commission-des-sondages.fr/notices/medias/fichiers/add/2166",
              "https://www.commission-des-sondages.fr/notices/medias/fichiers/add/2197",
              "https://www.commission-des-sondages.fr/notices/medias/fichiers/add/2216",
          }
          missing_notices = required_notices - source_urls
          if missing_notices:
              raise SystemExit(
                  "missing configured Commission notices: "
                  f"{sorted(missing_notices)}"
              )

          audited_first_locators = {
              record["source_locator"]
              for record in load_migration_registry()["french_additions"][FIRST_ROUND]
          }
          official_validation_events = [
              event
              for event in fetched
              if event.get("migration_source_locator") not in audited_first_locators
          ]

          official_waves = {
              ("Elabe", "2026-03-25", "2026-03-27"): (
                  "https://www.commission-des-sondages.fr/notices/medias/fichiers/add/2166",
                  6,
              ),
              ("Ipsos", "2026-05-27", "2026-05-28"): (
                  "https://www.commission-des-sondages.fr/notices/medias/fichiers/add/2197",
                  8,
              ),
              ("Ifop", "2026-06-22", "2026-06-24"): (
                  "https://www.commission-des-sondages.fr/notices/medias/fichiers/add/2216",
                  8,
              ),
          }
          for (pollster, start, end), (notice_url, expected_count) in (
              official_waves.items()
          ):
              wave_events = [
                  event
                  for event in official_validation_events
                  if event["pollster"] == pollster
                  and event["fieldwork_start"] == start
                  and event["fieldwork_end"] == end
              ]
              if len(wave_events) != expected_count:
                  raise SystemExit(
                      f"{pollster} {start} to {end}: expected "
                      f"{expected_count} events, found {len(wave_events)}"
                  )
              if any(
                  event["source_url"] != notice_url for event in wave_events
              ):
                  raise SystemExit(
                      f"{pollster} {start} to {end}: non-notice source remains"
                  )

          bardella_latest = max(
              (
                  event["fieldwork_end"]
                  for event in fetched
                  if any(
                      candidate.get("name") == "Jordan Bardella"
                      for candidate in event["candidates"]
                  )
              ),
              default="",
          )
          if bardella_latest < "2026-06-24":
              raise SystemExit(
                  "Jordan Bardella latest fieldwork end is too old: "
                  f"{bardella_latest or 'missing'}"
              )

          current_latest = max(
              (event["fieldwork_end"] for event in current),
              default="",
          )
          fetched_latest = max(
              event["fieldwork_end"] for event in fetched
          )

          if fetched_latest < current_latest:
              raise SystemExit(
                  "refusing older latest fieldwork date: "
                  f"{current_latest} -> {fetched_latest}"
              )

          second_events = (
              second_round.get("events")
              if isinstance(second_round, dict)
              else None
          )
          if (
              not isinstance(second_round, dict)
              or second_round.get("schema_version") != "1.0"
              or not isinstance(second_events, list)
              or not second_events
          ):
              raise SystemExit("invalid second-round output contract")
          if any(
              event.get("round") != "second_round"
              or len(event.get("candidates", [])) != 2
              or not str(event.get("source_url", "")).startswith(
                  ("http://", "https://")
              )
              for event in second_events
          ):
              raise SystemExit("invalid second-round event")

          if not isinstance(closest, dict) or closest.get("status") not in {
              "agree",
              "split",
              "ambiguous",
              "insufficient",
          }:
              raise SystemExit("invalid closest-runoff output contract")
          if closest.get("source") != second_round.get("source"):
              raise SystemExit("generated source attribution does not match")
          if closest["status"] == "agree" and not closest.get(
              "selected_matchup"
          ):
              raise SystemExit("agree status lacks selected matchup")

          def semantic_payload(value):
              if not isinstance(value, dict):
                  return value
              return {
                  key: item
                  for key, item in value.items()
                  if key != "generated_at"
              }

          changed = (
              fetched != current
              or semantic_payload(second_round)
              != semantic_payload(current_second_round)
              or semantic_payload(closest)
              != semantic_payload(current_closest)
          )

          registry_changed = current_registry != fetched_registry
          changed = changed or registry_changed

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              output.write(f"changed={str(changed).lower()}\n")

          if not changed:
              print(
                  "No semantic poll, runoff, or Commission registry "
                  "change was detected; generated_at is ignored."
              )
              raise SystemExit(0)

          def atomic_write_bytes(path, content):
              handle = tempfile.NamedTemporaryFile(
                  mode="wb",
                  dir=path.parent,
                  prefix=f".{path.name}.",
                  suffix=".tmp",
                  delete=False,
              )
              temporary = Path(handle.name)
              try:
                  with handle:
                      handle.write(content)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temporary, path)
              except BaseException:
                  temporary.unlink(missing_ok=True)
                  raise

          atomic_write_bytes(current_path, fetched_path.read_bytes())
          atomic_write_bytes(
              second_round_path,
              fetched_second_round_path.read_bytes(),
          )
          atomic_write_bytes(
              closest_path,
              fetched_closest_path.read_bytes(),
          )
          atomic_write_bytes(registry_path, fetched_registry_path.read_bytes())

          print(
              f"Validated {len(fetched)} first-round and "
              f"{len(second_events)} second-round events; "
              f"{contract_counts['complete']} complete and "
              f"{contract_counts['partial']} partial first-round events; "
              f"{rejected_current_waves} reviewed rejected waves removed "
              f"({rejected_current_events} prior events); "
              f"closest-runoff status {closest['status']}; "
              f"latest first-round fieldwork end {fetched_latest}"
          )
          PY

      - name: Rebuild Candidate Signals
        id: candidate_signals
        shell: bash
        run: |
          set -euo pipefail

          python -B -c 'from candidate_candidacy_status import load_candidate_candidacy_status; load_candidate_candidacy_status("candidate_candidacy_status.json")'
          python -B build_candidate_signals.py --candidacy-status candidate_candidacy_status.json

          if git diff --quiet -- candidate_signals.json \
            && git ls-files --error-unmatch \
              candidate_signals.json >/dev/null 2>&1
          then
            echo "candidate_signals_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_signals_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate Recent Changes Ledger
        if: steps.validate.outputs.changed == 'true'
        run: |
          python generate_recent_changes.py \
            --news news_wire.json \
            --polls polls.json \
            --runoff closest_tested_runoff.json \
            --second-round second_round_polls.json \
            --claims claims_under_scrutiny.json \
            --output recent_changes.json

      - name: Rebuild and validate publication manifest
        id: publication_manifest
        env:
          SOURCE_CHANGED: ${{ steps.validate.outputs.changed }}
          CANDIDATE_SIGNALS_CHANGED: ${{ steps.candidate_signals.outputs.candidate_signals_changed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SOURCE_CHANGED" == "true" || "$CANDIDATE_SIGNALS_CHANGED" == "true" ]]; then
            published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elif published_at="$(python -c 'import json; from build_publication_manifest import _utc_timestamp; print(_utc_timestamp(json.load(open("publication_manifest.json", encoding="utf-8")).get("published_at"), field="published_at"))' 2>/dev/null)"; then
            :
          else
            published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          python -B build_publication_manifest.py \
            --published-at "$published_at"
          python -B build_publication_manifest.py \
            --check \
            --published-at "$published_at"

          if git diff --quiet -- publication_manifest.json \
            && git ls-files --error-unmatch \
              publication_manifest.json >/dev/null 2>&1
          then
            echo "publication_manifest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "publication_manifest_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed poll data
        id: commit
        env:
          POLL_DATA_CHANGED: ${{ steps.validate.outputs.changed }}
          CANDIDATE_SIGNALS_CHANGED: ${{ steps.candidate_signals.outputs.candidate_signals_changed }}
          PUBLICATION_MANIFEST_CHANGED: ${{ steps.publication_manifest.outputs.publication_manifest_changed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$POLL_DATA_CHANGED" != "true" && "$CANDIDATE_SIGNALS_CHANGED" != "true" && "$PUBLICATION_MANIFEST_CHANGED" != "true" ]]; then
            echo "No poll or derived publication changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            polls.json second_round_polls.json closest_tested_runoff.json \
            commission_notice_registry.json \
            recent_changes.json candidate_signals.json \
            publication_manifest.json
          git commit -m "Update polls data"

          published_at="$(python -c 'import json; print(json.load(open("publication_manifest.json", encoding="utf-8"))["published_at"])')"
          python -B -c 'from candidate_candidacy_status import load_candidate_candidacy_status; load_candidate_candidacy_status("candidate_candidacy_status.json")'
          python -B build_candidate_signals.py --candidacy-status candidate_candidacy_status.json
          python -B build_publication_manifest.py \
            --published-at "$published_at"
          python -B build_publication_manifest.py \
            --check \
            --published-at "$published_at"
          git diff --exit-code -- \
            candidate_signals.json publication_manifest.json

          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
