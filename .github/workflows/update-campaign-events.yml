name: Update campaign events

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-data-update
  cancel-in-progress: false

jobs:
  update-campaign-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Campaign Events validation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest -v \
            test_campaign_event_sources \
            test_campaign_events_contract \
            test_campaign_event_institutional_seeds \
            test_rn_agenda_adapter \
            test_build_campaign_events \
            test_publication_manifest \
            test_campaign_events_workflow_contract

      - name: Create canonical publication timestamp
        id: campaign_timestamp
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "value=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Validate and atomically publish Campaign Events
        id: campaign_events
        shell: bash
        run: |
          set -euo pipefail

          python -B build_campaign_events.py \
            --candidates candidate_candidacy_status.json \
            --generated-at "${{ steps.campaign_timestamp.outputs.value }}" \
            --preserve-generated-at-from campaign_events.json \
            --output /tmp/campaign_events.json

          python -B - <<'PY'
          import json
          from pathlib import Path
          from campaign_events_contract import validate_campaign_events_artifact

          candidate = json.loads(Path("/tmp/campaign_events.json").read_text(encoding="utf-8"))
          validate_campaign_events_artifact(candidate)
          print("Candidate Campaign Events artifact is valid.")
          PY

          if cmp --silent campaign_events.json /tmp/campaign_events.json; then
            echo "No Campaign Events change was detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python -B - <<'PY'
          from pathlib import Path
          from build_campaign_events import atomic_write

          candidate = Path("/tmp/campaign_events.json").read_bytes()
          atomic_write("campaign_events.json", candidate)
          PY
            python -B -c 'import json; from campaign_events_contract import validate_campaign_events_artifact; validate_campaign_events_artifact(json.load(open("campaign_events.json", encoding="utf-8")))'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and validate publication manifest
        id: publication_manifest
        env:
          CAMPAIGN_EVENTS_CHANGED: ${{ steps.campaign_events.outputs.changed }}
          CAMPAIGN_TIMESTAMP: ${{ steps.campaign_timestamp.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CAMPAIGN_EVENTS_CHANGED" == "true" ]]; then
            published_at="$CAMPAIGN_TIMESTAMP"
          else
            published_at="$(python -B -c 'import json; print(json.load(open("publication_manifest.json", encoding="utf-8"))["published_at"])')"
          fi

          python -B build_publication_manifest.py --published-at "$published_at"
          python -B build_publication_manifest.py \
            --check \
            --published-at "$published_at"

          if git diff --quiet -- publication_manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated-file scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(campaign_events|publication_manifest)\.json$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit changed Campaign Events data
        id: commit
        env:
          CAMPAIGN_EVENTS_CHANGED: ${{ steps.campaign_events.outputs.changed }}
          PUBLICATION_MANIFEST_CHANGED: ${{ steps.publication_manifest.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CAMPAIGN_EVENTS_CHANGED" != "true" && "$PUBLICATION_MANIFEST_CHANGED" != "true" ]]; then
            echo "No Campaign Events publication change detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- campaign_events.json publication_manifest.json
          git commit -m "Update campaign events data" -- \
            campaign_events.json publication_manifest.json

          git fetch origin main
          git rebase origin/main

          python -B -c 'import json; from campaign_events_contract import validate_campaign_events_artifact; validate_campaign_events_artifact(json.load(open("campaign_events.json", encoding="utf-8")))'
          published_at="$(python -B -c 'import json; print(json.load(open("publication_manifest.json", encoding="utf-8"))["published_at"])')"
          python -B build_publication_manifest.py --published-at "$published_at"
          python -B build_publication_manifest.py \
            --check \
            --published-at "$published_at"

          if ! git diff --quiet -- campaign_events.json publication_manifest.json; then
            git add -- campaign_events.json publication_manifest.json
            git commit --amend --no-edit
          fi

          python -B -c 'import json; from campaign_events_contract import validate_campaign_events_artifact; validate_campaign_events_artifact(json.load(open("campaign_events.json", encoding="utf-8")))'
          git diff --exit-code -- campaign_events.json publication_manifest.json
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
