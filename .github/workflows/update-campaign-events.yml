name: Validate campaign events

on:
  push:
    paths:
      - "campaign_events_manual.json"
      - "campaign_event_updates_manual.json"
      - "campaign_events.json"
      - "campaign_events_manual.py"
      - "campaign_event_updates_manual.py"
      - "import_campaign_events.py"
      - "build_campaign_events.py"
      - "campaign_events_contract.py"
      - "campaign_event_*.py"
      - "candidate_candidacy_status.py"
      - "la_lettre_expansion_adapter.py"
      - "rn_agenda_adapter.py"
      - "tf1_lci_adapter.py"
      - "campaign_event_institutional_seeds.json"
      - "campaign_event_sources.json"
      - "candidate_candidacy_status.json"
      - "test_*campaign_event*.py"
      - ".github/workflows/update-campaign-events.yml"

  pull_request:
    paths:
      - "campaign_events_manual.json"
      - "campaign_event_updates_manual.json"
      - "campaign_events.json"
      - "campaign_events_manual.py"
      - "campaign_event_updates_manual.py"
      - "import_campaign_events.py"
      - "build_campaign_events.py"
      - "campaign_events_contract.py"
      - "campaign_event_*.py"
      - "candidate_candidacy_status.py"
      - "la_lettre_expansion_adapter.py"
      - "rn_agenda_adapter.py"
      - "tf1_lci_adapter.py"
      - "campaign_event_institutional_seeds.json"
      - "campaign_event_sources.json"
      - "candidate_candidacy_status.json"
      - "test_*campaign_event*.py"
      - ".github/workflows/update-campaign-events.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-campaign-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Campaign Events validation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest -v \
            test_campaign_event_sources \
            test_campaign_events_contract \
            test_campaign_event_institutional_seeds \
            test_campaign_events_manual \
            test_campaign_event_updates_manual \
            test_add_campaign_event \
            test_update_campaign_event \
            test_import_campaign_events \
            test_build_campaign_events \
            test_publication_manifest.PublicationManifestTests.test_campaign_events_lane_metadata \
            test_publication_manifest.PublicationManifestTests.test_tracked_campaign_events_lane_metadata \
            test_publication_manifest.PublicationManifestTests.test_manual_workflow_no_churn_sequence_matches_both_tracked_outputs \
            test_publication_manifest.PublicationManifestTests.test_genuine_campaign_events_change_updates_digest_and_snapshot \
            test_publication_manifest.PublicationManifestTests.test_malformed_campaign_events_is_isolated_to_its_lane \
            test_publication_manifest.PublicationManifestTests.test_missing_campaign_events_is_isolated_to_its_lane \
            test_publication_manifest.PublicationManifestTests.test_check_does_not_modify_publication_manifest \
            test_publication_manifest.PublicationManifestTests.test_valid_complete_inputs \
            test_campaign_events_workflow_contract

      - name: Verify Campaign Events artifact is synchronized
        shell: bash
        run: |
          set -euo pipefail

          python -B build_campaign_events.py \
            --seeds campaign_event_institutional_seeds.json \
            --sources campaign_event_sources.json \
            --candidates candidate_candidacy_status.json \
            --manual-events campaign_events_manual.json \
            --event-updates campaign_event_updates_manual.json \
            --generated-at "2099-01-01T00:00:00Z" \
            --preserve-generated-at-from campaign_events.json \
            --output /tmp/campaign_events.json

          if ! cmp --silent campaign_events.json /tmp/campaign_events.json; then
            echo "campaign_events.json is not synchronized with its authoritative inputs."
            diff -u campaign_events.json /tmp/campaign_events.json || true
            exit 1
          fi

      - name: Verify publication manifest is synchronized
        shell: bash
        run: |
          set -euo pipefail

          published_at="$(
            python -B -c 'import json; print(json.load(open("publication_manifest.json", encoding="utf-8"))["published_at"])'
          )"

          python -B build_publication_manifest.py \
            --check \
            --published-at "$published_at"

          python -B - "$published_at" <<'PY'
          import json
          import sys
          from pathlib import Path
          from build_publication_manifest import build_manifest

          published_at = sys.argv[1]
          tracked_path = Path("publication_manifest.json")
          tracked = json.loads(tracked_path.read_text(encoding="utf-8"))
          rebuilt = build_manifest(Path.cwd(), published_at=published_at)

          if rebuilt != tracked:
              print("publication_manifest.json is not synchronized with repository inputs.")
              print("tracked snapshot:", tracked.get("snapshot_id"))
              print("rebuilt snapshot:", rebuilt.get("snapshot_id"))
              raise SystemExit(1)

          print("publication_manifest.json is synchronized.")
          PY

      - name: Verify validation did not modify repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
