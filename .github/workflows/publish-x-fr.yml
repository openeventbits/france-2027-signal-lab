name: Publish FR27 to X

on:
  schedule:
    - cron: '17,47 7-23 * * *'
      timezone: 'Europe/Paris'
    - cron: '13 12 * * *'
      timezone: 'Europe/Paris'
    - cron: '7 15 * * *'
      timezone: 'Europe/Paris'
    - cron: '37 17 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publisher mode'
        required: true
        default: 'updates'
        type: choice
        options:
          - updates
          - media
          - agenda
          - issues
          - bootstrap
          - buffer-info
      publish:
        description: 'Actually publish to X (false = dry run)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fr27-social-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.FR27_SOCIAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out production branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install social publishing dependencies
        run: python -m pip install --disable-pip-version-check -r social/requirements.txt

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
            publish="${{ inputs.publish }}"
          else
            publish="true"
            case "${{ github.event.schedule }}" in
              '17,47 7-23 * * *') mode="updates" ;;
              '13 12 * * *') mode="media" ;;
              '7 15 * * *') mode="agenda" ;;
              '37 17 * * *') mode="issues" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 2 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$mode publish=$publish"

      - name: Validate publishing configuration
        if: steps.mode.outputs.publish == 'true' && steps.mode.outputs.mode != 'bootstrap' && steps.mode.outputs.mode != 'buffer-info'
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
        run: |
          set -euo pipefail
          [[ -n "$BUFFER_API_KEY" ]] || { echo '::error::Missing BUFFER_API_KEY secret'; exit 2; }
          [[ -n "$BUFFER_ORGANIZATION_ID" ]] || { echo '::error::Missing BUFFER_ORGANIZATION_ID variable'; exit 2; }
          [[ -n "$BUFFER_X_CHANNEL_ID" ]] || { echo '::error::Missing BUFFER_X_CHANNEL_ID variable'; exit 2; }

      - name: Show Buffer organization and channels
        if: steps.mode.outputs.mode == 'buffer-info'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -B social/social_publish.py buffer-info

      - name: Check out social state/assets branch
        if: steps.mode.outputs.mode == 'updates' || steps.mode.outputs.mode == 'bootstrap' || (steps.mode.outputs.publish == 'true' && contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode))
        uses: actions/checkout@v7
        with:
          ref: social-assets
          path: social-assets-branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap current items without publishing
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr27-social
          python -B social/social_publish.py bootstrap \
            --output /tmp/fr27-social/state.json

      - name: Publish new What Changed and event items
        if: steps.mode.outputs.mode == 'updates'
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr27-social
          args=(
            --state social-assets-branch/social/x/state.json
            --state-output /tmp/fr27-social/state.json
            --lookback-hours 24
            --max-posts 4
          )
          if [[ "${{ steps.mode.outputs.publish }}" != "true" ]]; then
            args+=(--dry-run)
          fi
          python -B social/social_publish.py updates "${args[@]}"

      - name: Persist social state
        if: steps.mode.outputs.mode == 'bootstrap' || (steps.mode.outputs.mode == 'updates' && steps.mode.outputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          rel="social/x/state.json"
          mkdir -p "social-assets-branch/$(dirname "$rel")"
          cp /tmp/fr27-social/state.json "social-assets-branch/$rel"
          cd social-assets-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$rel"
          if ! git diff --cached --quiet; then
            git commit -m 'Update X publishing state'
            git push origin HEAD:social-assets
          fi

      - name: Install Playwright
        if: contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Capture FR27 panel
        if: contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr27-social
          python -B social/capture_social_panel.py \
            --kind "${{ steps.mode.outputs.mode }}" \
            --output "/tmp/fr27-social/${{ steps.mode.outputs.mode }}.png" \
            --metrics-output "/tmp/fr27-social/${{ steps.mode.outputs.mode }}.json"

      - name: Upload dry-run screenshot
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.publish != 'true' && contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode)
        uses: actions/upload-artifact@v4
        with:
          name: fr27-${{ steps.mode.outputs.mode }}-social-capture
          path: |
            /tmp/fr27-social/${{ steps.mode.outputs.mode }}.png
            /tmp/fr27-social/${{ steps.mode.outputs.mode }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish screenshot asset
        id: asset
        if: steps.mode.outputs.publish == 'true' && contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode)
        shell: bash
        run: |
          set -euo pipefail
          kind="${{ steps.mode.outputs.mode }}"
          paris_date="$(TZ=Europe/Paris date +%F)"
          rel="social/x/captures/${kind}/${paris_date}.png"
          mkdir -p "social-assets-branch/$(dirname "$rel")"
          cp "/tmp/fr27-social/${kind}.png" "social-assets-branch/$rel"

          cd social-assets-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$rel"
          if ! git diff --cached --quiet; then
            git commit -m "Refresh X ${kind} capture ${paris_date}"
            git push origin HEAD:social-assets
          fi

          url="https://raw.githubusercontent.com/openeventbits/france-2027-signal-lab/social-assets/$rel"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify screenshot is publicly reachable
        if: steps.mode.outputs.publish == 'true' && contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 2 --retry-all-errors \
            --output /dev/null \
            "${{ steps.asset.outputs.url }}"

      - name: Publish visual post
        if: contains(fromJSON('["media","agenda","issues"]'), steps.mode.outputs.mode)
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
        run: |
          set -euo pipefail
          args=(
            --kind "${{ steps.mode.outputs.mode }}"
            --metrics-json "/tmp/fr27-social/${{ steps.mode.outputs.mode }}.json"
          )
          if [[ "${{ steps.mode.outputs.publish }}" == "true" ]]; then
            args+=(--image-url "${{ steps.asset.outputs.url }}")
          else
            args+=(--dry-run)
          fi
          python -B social/social_publish.py visual "${args[@]}"
