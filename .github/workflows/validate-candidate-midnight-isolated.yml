name: Read-only candidate midnight contracts

on:
  push:
    branches:
      - codex/ci-candidate-midnight-5f4cbdf743eb

permissions:
  contents: read

jobs:
  exact-pr-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 5f4cbdf743ebced98895abd3b7d5595d3cd39ab9
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact review commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up hosted Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install existing contract dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml pypdf

      - name: Verify source identity and pin represented date
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git log -1 --format='%H %s'
          uname -a
          python --version
          node --version
          python -B - <<'PY'
          import os
          import build_candidate_reference as reference
          sources = reference.load_sources()
          lifecycle = reference.project_candidate_page_lifecycle(
              sources["candidate_candidacy_status"], reference.ROOT,
          )
          represented = reference.snapshot_event_reference_date(
              reference.ROOT, lifecycle["published_ids"],
          ).isoformat()
          print("Candidate snapshot represented date:", represented)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CANDIDATE_EVENT_REFERENCE_DATE=" + represented + "\n")
          PY

      - name: Run Candidate Agenda Issue publication and date contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            test_candidate_reference \
            test_candidate_page_contract \
            test_candidate_family_publication \
            test_candidate_lifecycle \
            test_candidate_hub \
            test_candidate_poll_links \
            test_candidate_refresh_cycle \
            test_campaign_events_contract \
            test_agenda_page_contract \
            test_agenda_pages \
            test_issue_pages \
            test_agenda_family_automation \
            test_issue_family_automation \
            test_publication_orchestration_contract \
            test_agenda_push_race \
            test_production_publication_queue \
            test_publication_manifest \
            test_route_registry \
            test_search_foundation \
            test_agenda_shared_metric_authority \
            test_issue_shared_metric_authority \
            test_coverage_metric_contract \
            test_candidate_reference_date

      - name: Verify source and publication artifacts remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git status --short
          git diff --check
          git diff --exit-code

