name: Update Claims Under Scrutiny

on:
  workflow_dispatch:
  schedule:
    - cron: "47 7,17 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: production-data-update
  cancel-in-progress: false

jobs:
  update-claims-under-scrutiny:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run deterministic collector tests
        run: |
          python -m unittest -v \
            test_fetch_claims_under_scrutiny.py \
            test_claims_workflow_contract.py

      - name: Fetch Claims Under Scrutiny into temporary files
        env:
          GOOGLE_FACTCHECK_API_KEY: ${{ secrets.GOOGLE_FACTCHECK_API_KEY }}
        run: |
          python fetch_claims_under_scrutiny.py \
            --candidacy-status candidate_candidacy_status.json \
            --existing-claims claims_under_scrutiny.json \
            --output /tmp/claims_under_scrutiny.json \
            --diagnostics-output /tmp/claims_under_scrutiny_diagnostics.json \
            --archive-window-days 365

      - name: Summarize Claims collector diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          diagnostics_path = Path("/tmp/claims_under_scrutiny_diagnostics.json")
          lines = ["## Claims collector diagnostics", ""]
          try:
              if not diagnostics_path.exists():
                  lines.append("Diagnostics file was not created.")
              else:
                  payload = json.loads(diagnostics_path.read_text(encoding="utf-8"))
                  query_status = payload.get("query_status", [])
                  status_counts = Counter(
                      item.get("status", "unknown")
                      for item in query_status
                      if isinstance(item, dict)
                  )
                  deduplication = payload.get("deduplication", {})
                  historical = payload.get("historical_evidence", {})
                  final_counts = payload.get("final_counts")
                  lines.extend(
                      [
                          f"- Candidate query count: {payload.get('candidate_query_count', 'unavailable')}",
                          "- Query status: " + (
                              ", ".join(
                                  f"{status}={count}"
                                  for status, count in sorted(status_counts.items())
                              ) or "none"
                          ),
                          f"- Unknown publisher hosts: {len(payload.get('excluded_unknown_hosts', []))}",
                          f"- Invalid reviews: {len(payload.get('invalid_reviews', []))}",
                          f"- Unresolved associations: {len(payload.get('unresolved_associations', []))}",
                          "- Deduplication: "
                          f"seen={deduplication.get('canonical_reviews_seen', 0)}, "
                          f"merged={deduplication.get('duplicate_instances_merged', 0)}",
                          "- Historical evidence: "
                          f"retained={historical.get('retained_existing_reviews', 0)}, "
                          f"fetched={historical.get('fetched_reviews', 0)}, "
                          f"merged={historical.get('merged_reviews', 0)}",
                          "- Final counts: " + (
                              ", ".join(
                                  f"{key}={value}"
                                  for key, value in sorted(final_counts.items())
                              ) if isinstance(final_counts, dict) else "unavailable"
                          ),
                      ]
                  )
                  if payload.get("failure"):
                      lines.append(f"- Failure: {payload['failure']}")
          except Exception as error:
              lines.append(f"Diagnostics summary unavailable: {error}")

          summary = "\n".join(lines)
          print(summary)
          try:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                  "a", encoding="utf-8"
              ) as output:
                  output.write(summary + "\n")
          except Exception as error:
              print(f"Could not write GitHub step summary: {error}")
          PY

      - name: Validate and atomically stage fetched public data
        id: validate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from candidate_candidacy_status import load_candidate_candidacy_status
          from fetch_claims_under_scrutiny import (
              CollectorError,
              atomic_write_json,
              semantic_public_content,
              validate_public_bundle,
          )

          current_path = Path("claims_under_scrutiny.json")
          fetched_path = Path("/tmp/claims_under_scrutiny.json")

          def fail(message):
              raise SystemExit(f"Claims Under Scrutiny validation failed: {message}")

          def load_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  fail(f"could not read {path}: {error}")

          candidacy = load_candidate_candidacy_status(
              "candidate_candidacy_status.json"
          )
          fetched = load_json(fetched_path)
          try:
              validate_public_bundle(
                  fetched,
                  expected_archive_window_days=365,
                  candidacy_payload=candidacy,
              )
          except CollectorError as error:
              fail(str(error))

          if current_path.exists():
              current = load_json(current_path)
              try:
                  validate_public_bundle(
                      current,
                      expected_archive_window_days=365,
                      candidacy_payload=None,
                  )
              except CollectorError as error:
                  fail(f"existing public file is malformed; preserving it: {error}")
              changed = semantic_public_content(current) != semantic_public_content(fetched)
          else:
              changed = True

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"changed={str(changed).lower()}\n")

          if not changed:
              print("No semantic public data change was detected for this UTC date.")
              raise SystemExit(0)

          atomic_write_json(current_path, fetched)
          print(
              "Validated and atomically staged "
              f"{fetched['counts']['reviews']} reviews for "
              f"{fetched['candidate_query']['count']} active query candidates."
          )
          PY

      - name: Rebuild Candidate Signals
        id: candidate_signals
        shell: bash
        run: |
          set -euo pipefail

          python -B -c 'from candidate_candidacy_status import load_candidate_candidacy_status; load_candidate_candidacy_status("candidate_candidacy_status.json")'
          python -B build_candidate_signals.py --candidacy-status candidate_candidacy_status.json

          if git diff --quiet -- candidate_signals.json \
            && git ls-files --error-unmatch \
              candidate_signals.json >/dev/null 2>&1
          then
            echo "candidate_signals_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_signals_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate Recent Changes Ledger
        if: steps.validate.outputs.changed == 'true'
        run: |
          python generate_recent_changes.py \
            --news news_wire.json \
            --polls polls.json \
            --runoff closest_tested_runoff.json \
            --second-round second_round_polls.json \
            --claims claims_under_scrutiny.json \
            --output recent_changes.json

      - name: Rebuild and validate publication manifest
        id: publication_manifest
        env:
          SOURCE_CHANGED: ${{ steps.validate.outputs.changed }}
          CANDIDATE_SIGNALS_CHANGED: ${{ steps.candidate_signals.outputs.candidate_signals_changed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SOURCE_CHANGED" == "true" || "$CANDIDATE_SIGNALS_CHANGED" == "true" ]]; then
            published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elif published_at="$(python -c 'import json; from build_publication_manifest import _utc_timestamp; print(_utc_timestamp(json.load(open("publication_manifest.json", encoding="utf-8")).get("published_at"), field="published_at"))' 2>/dev/null)"; then
            :
          else
            published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          python -B build_publication_manifest.py \
            --published-at "$published_at"
          python -B build_publication_manifest.py \
            --check \
            --published-at "$published_at"

          if git diff --quiet -- publication_manifest.json \
            && git ls-files --error-unmatch \
              publication_manifest.json >/dev/null 2>&1
          then
            echo "publication_manifest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "publication_manifest_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed Claims Under Scrutiny data
        id: commit
        env:
          CLAIMS_CHANGED: ${{ steps.validate.outputs.changed }}
          CANDIDATE_SIGNALS_CHANGED: ${{ steps.candidate_signals.outputs.candidate_signals_changed }}
          PUBLICATION_MANIFEST_CHANGED: ${{ steps.publication_manifest.outputs.publication_manifest_changed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CLAIMS_CHANGED" != "true" && "$CANDIDATE_SIGNALS_CHANGED" != "true" && "$PUBLICATION_MANIFEST_CHANGED" != "true" ]]; then
            echo "No claims or derived publication changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            claims_under_scrutiny.json recent_changes.json \
            candidate_signals.json \
            publication_manifest.json
          git commit -m "Update Claims Under Scrutiny" -- \
            claims_under_scrutiny.json recent_changes.json \
            candidate_signals.json \
            publication_manifest.json
          git fetch origin main
          git rebase origin/main

          post_rebase_published_at="$(python -c 'import json; print(json.load(open("publication_manifest.json", encoding="utf-8"))["published_at"])')"
          python generate_recent_changes.py \
            --news news_wire.json \
            --polls polls.json \
            --runoff closest_tested_runoff.json \
            --second-round second_round_polls.json \
            --claims claims_under_scrutiny.json \
            --output recent_changes.json
          python -B -c 'from candidate_candidacy_status import load_candidate_candidacy_status; load_candidate_candidacy_status("candidate_candidacy_status.json")'
          python -B build_candidate_signals.py --candidacy-status candidate_candidacy_status.json
          python -B build_publication_manifest.py \
            --published-at "$post_rebase_published_at"

          if ! git diff --quiet -- \
            recent_changes.json candidate_signals.json publication_manifest.json
          then
            post_rebase_published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python -B build_publication_manifest.py \
              --published-at "$post_rebase_published_at"
            git add -- \
              recent_changes.json candidate_signals.json publication_manifest.json
            git commit --amend --no-edit
          fi

          if git diff --quiet origin/main..HEAD -- \
            claims_under_scrutiny.json recent_changes.json \
            candidate_signals.json \
            publication_manifest.json; then
            echo "The semantic data change is already present on main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          final_published_at="$(python -c 'import json; print(json.load(open("publication_manifest.json", encoding="utf-8"))["published_at"])')"
          python -B -c 'from candidate_candidacy_status import load_candidate_candidacy_status; load_candidate_candidacy_status("candidate_candidacy_status.json")'
          python -B build_candidate_signals.py --candidacy-status candidate_candidacy_status.json
          python -B build_publication_manifest.py \
            --published-at "$final_published_at"
          python -B build_publication_manifest.py \
            --check \
            --published-at "$final_published_at"
          git diff --exit-code -- \
            recent_changes.json candidate_signals.json publication_manifest.json

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
