<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>FR27 TRACE shell</title>
  </head>
  <body>
    <main class="trace-canvas" data-renderer="trace-shell.v1">
      <div class="outer-frame" aria-hidden="true"></div>
      <header class="trace-header">
        <div class="brand-line">
          <span class="brand">FR27 TRACE</span>
          <span class="brand-separator">/</span>
          <span class="family" data-bind="family"></span>
        </div>
        <div class="draft-meta">
          <span data-bind="status"></span>
          <span aria-hidden="true">·</span>
          <span data-bind="observationWindow"></span>
        </div>
      </header>
      <div class="header-divider" aria-hidden="true"></div>

      <section class="finding-region" aria-label="Primary finding">
        <div class="entity-label" data-bind="displayLabel"></div>
        <div class="finding-text" data-bind="finding"></div>
        <div class="qualifier" data-bind="qualifier"></div>
      </section>

      <section class="trace-field" aria-label="TRACE field shell preview">
        <div class="field-heading shell-only">TRACE FIELD / SHELL PREVIEW</div>
        <div class="axis-label axis-start shell-only">WINDOW START</div>
        <div class="axis-label axis-end shell-only">WINDOW END</div>
        <div class="time-axis shell-only" aria-hidden="true"></div>
        <div class="vertical-guides shell-only" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="lane-guides shell-only" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="field-note shell-only">NEUTRAL DEVELOPMENT GEOMETRY · NO DETECTOR SEMANTICS</div>

        <div class="coverage-field" data-coverage-field hidden>
          <div class="coverage-kicker">COVERAGE ANATOMY · COMPARATIVE STRUCTURE</div>
          <div class="coverage-period coverage-period-prior">
            <span class="coverage-period-label" data-coverage="priorLabel"></span>
            <span class="coverage-period-dates" data-coverage="priorDates"></span>
          </div>
          <div class="coverage-direction" aria-hidden="true">
            <span></span>
            <svg viewBox="0 0 32 12" focusable="false">
              <path d="M1 6h27M23 1l5 5-5 5"></path>
            </svg>
          </div>
          <div class="coverage-period coverage-period-current">
            <span class="coverage-period-label" data-coverage="currentLabel"></span>
            <span class="coverage-period-dates" data-coverage="currentDates"></span>
          </div>
          <div class="coverage-rows" data-coverage-rows></div>
        </div>

        <div class="flash-field" data-flash-field hidden>
          <div class="flash-topline">
            <span class="flash-kicker" data-flash="componentLabel"></span>
            <span class="flash-classification" data-flash="classificationLabel"></span>
          </div>
          <div class="flash-period flash-period-previous">
            <span class="flash-period-label" data-flash="previousLabel"></span>
            <span class="flash-period-dates" data-flash="previousDates"></span>
          </div>
          <div class="flash-period flash-period-latest">
            <span class="flash-period-label" data-flash="latestLabel"></span>
            <span class="flash-period-dates" data-flash="latestDates"></span>
          </div>
          <div class="flash-chart" data-flash-chart aria-label="Fourteen daily Wikipedia pageview observations"></div>
          <div class="flash-summary" data-flash-summary></div>
        </div>
      </section>

      <div class="footer-divider" aria-hidden="true"></div>
      <footer class="trace-footer">
        <section class="footer-zone footer-source" data-footer-zone="source">
          <span class="footer-label">SOURCE / DATA SCOPE</span>
          <span data-bind="sourceScope"></span>
        </section>
        <section class="footer-zone footer-method" data-footer-zone="method">
          <span class="footer-label">METHODOLOGICAL BOUNDARY</span>
          <span data-bind="methodologicalBoundary"></span>
        </section>
        <section class="footer-zone footer-brand" data-footer-zone="brand">
          <span class="footer-label" data-bind="rendererVersion"></span>
          <span class="brand-signature">
            <svg
              class="signature-glyph"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M3.5 11.5a8 8 0 0 1 8-8"></path>
              <path d="M7 11.5A4.5 4.5 0 0 1 11.5 7"></path>
              <circle cx="12" cy="12" r="1.75"></circle>
              <path d="M12.5 17a4.5 4.5 0 0 0 4.5-4.5"></path>
              <path d="M12.5 20.5a8 8 0 0 0 8-8"></path>
            </svg>
            <span class="brand-url">france2027.app</span>
          </span>
        </section>
      </footer>
    </main>
  </body>
</html>
